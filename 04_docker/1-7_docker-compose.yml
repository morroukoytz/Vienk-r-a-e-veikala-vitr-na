# =====================================================================
# 1-7 Simple E-commerce Catalogue - Docker Compose
#
# Run from the REPOSITORY ROOT:
#   docker compose --env-file .env -f 04_docker/1-7_docker-compose.yml up -d --build
#
# All relative paths below are relative to THIS folder (04_docker/).
# Values like ${POSTGRES_DB} are read from the .env file.
# ${VAR:?message} means: stop with an error if the variable is missing.
# =====================================================================
name: ecommerce-catalogue

services:
  # ---------------- PostgreSQL 15 database ----------------
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Data survives container restarts (it is removed only together with the volume)
      - db_data:/var/lib/postgresql/data
      # Init scripts run in alphabetical order on the FIRST start only
      - ../03_database/1-7_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../03_database/1-7_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------- Backend API (Python + FastAPI) ----------------
  backend:
    build:
      context: ../02_source_code/backend
    image: ecommerce-catalogue-backend
    restart: unless-stopped
    environment:
      DB_HOST: db            # service name = host name inside the Docker network
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy   # wait until PostgreSQL accepts connections
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- Frontend (nginx) ----------------
  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../02_source_code/frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db_data:
