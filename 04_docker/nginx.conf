# nginx configuration for the frontend container.
# 1) Serves the static files (HTML, CSS, JS) from /usr/share/nginx/html
#    (this folder is mounted from ../02_source_code/frontend).
# 2) Forwards every request that starts with /api/ to the backend service.
#    The browser talks to ONE address only (localhost:8080), so there are
#    no CORS problems.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not show the nginx version in error pages and headers
    server_tokens off;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Limit the size of request bodies (orders and forms are small)
    client_max_body_size 1m;

    # --- API requests -> backend container ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Static files ---
    location / {
        try_files $uri $uri/ =404;
    }
}
